events { 
    worker_connections 1024; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    client_max_body_size 200M;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:5000;
    }

    # HTTP Server: Redirect all traffic to HTTPS and handle ACME challenge
    server {
        listen 80;
        server_name techdaily.duckdns.org _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: Full SSL Termination with HTTP/2
    server {
        listen 443 ssl;
        http2 on;
        server_name techdaily.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/techdaily.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/techdaily.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Backend API, Uploads and Health
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /health {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        location /uploads/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        # Frontend Nuxt Nitro SSR
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
