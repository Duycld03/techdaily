events { 
    worker_connections 1024; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    client_max_body_size 350M;
    client_body_timeout 300s;
    server_tokens off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_req_status 429;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:5000;
    }

    # HTTP Server: Redirect all traffic to HTTPS and handle ACME challenge
    server {
        listen 80;
        server_name techdaily.duckdns.org _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: Full SSL Termination with HTTP/2
    server {
        listen 443 ssl;
        http2 on;
        server_name techdaily.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/techdaily.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/techdaily.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;

        # Backend API, Uploads and Health
        # Authentication Rate Limiting (Prevent Brute-Force)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # AI & RAG Rate Limiting (Prevent LLM & Embedding token flooding)
        location ~* ^/api/v1/(daily/explain-term|library/books/[^/]+/ask|quiz/generate) {
            limit_req zone=ai_limit burst=5 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 120s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # Backend API with general rate limiting
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 120s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /health {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        location /uploads/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        # Block hidden files and sensitive dotfiles (.env, .git, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Block scanner probes for non-existent server scripts
        location ~* \.(php|aspx?|jsp|cgi)$ {
            access_log off;
            log_not_found off;
            return 404;
        }

        # Frontend Nuxt Nitro SSR
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
