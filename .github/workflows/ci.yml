name: TechDaily CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore backend/TechDaily.sln

      - name: Build Backend (Release)
        run: dotnet build backend/TechDaily.sln --configuration Release --no-restore

      - name: Run Backend Tests (35 Tests)
        run: dotnet test backend/TechDaily.sln --configuration Release --no-build --verbosity normal

  frontend-ci:
    name: Frontend CI (Nuxt 4 / Vue 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Run Frontend Tests (Vitest - 36 Tests)
        run: npm --prefix frontend test

      - name: Verify Frontend Production Build (Nuxt Nitro)
        run: npm --prefix frontend run build
