services:
  db:
    image: pgvector/pgvector:pg17
    container_name: deeppace_postgres
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: deeppace_db
      POSTGRES_USER: deeppace_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-deeppace_password_secret}"
    ports:
      - "5432:5432"
    volumes:
      - deeppace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeppace_user -d deeppace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  deeppace-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: deeppace_pgadmin
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@deeppace.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_secret
    ports:
      - "5051:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  deeppace_pgdata:
