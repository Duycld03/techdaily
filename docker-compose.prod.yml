services:
  db:
    image: pgvector/pgvector:pg17
    container_name: techdaily_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: techdaily_db
      POSTGRES_USER: techdaily_user
      POSTGRES_PASSWORD: techdaily_password_secret
    volumes:
      - techdaily_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techdaily_user -d techdaily_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techdaily_backend_prod
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=techdaily_db;Username=techdaily_user;Password=techdaily_password_secret"
      Jwt__Secret: "${JWT_SECRET:-TechDaily_Senior_Super_Secret_Key_2026_Min_32_Chars!}"
      Jwt__Issuer: "TechDaily"
      Jwt__Audience: "TechDailyUsers"
      Gemini__ApiKey: "${GEMINI_API_KEY}"
      Gemini__Model: "${GEMINI_MODEL:-gemini-3.5-flash}"
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET}"
    volumes:
      - techdaily_storage:/storage/audios
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techdaily_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE_URL: ""
      NUXT_PUBLIC_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-982684500709-75solmbterlbdvut85btisallcsf83ef.apps.googleusercontent.com}"
      API_INTERNAL_URL: "http://backend:5000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: techdaily_nginx_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  techdaily_pgdata_prod:
  techdaily_storage:
