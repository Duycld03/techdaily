schema: spec-driven

context: |
  TechDaily is a daily micro-learning and Senior interview preparation platform.
  Key Guidelines:
  - 100% English codebase (code, symbols, tests, comments, API contracts, logs).
  - Source documents retain their original language (English docs stay in English, Vietnamese docs stay in Vietnamese).
  - Multi-language UI (i18n: en-US, vi-VN).
  - Dark Mode first for night-time developer usage.
  Tech stack:
  - Backend: ASP.NET Core (.NET 10), C# 13, Clean Architecture with Plain Use-Case Handlers (Pure DI), Rich Domain Model, EF Core 9 (Npgsql), PostgreSQL 17 (pgvector)
  - Frontend: Nuxt 3 (Vue 3.5, SSR/PWA), Tailwind CSS, Pinia, @nuxtjs/i18n (en/vi), @nuxtjs/color-mode (Dark/Light), Markdown-it + Shiki Syntax Highlighter, Cytoscape.js Knowledge Graph, Lucide Icons
  - AI Engine: Gemini 3.5 Flash Lite (<5s low latency for scenarios & quizzes), gemini-embedding-001 (768-D vectors), Structured JSON Output, Semantic Term Cache
  - Background Jobs: BackgroundService with PeriodicTimer for notifications & async PDF ingestion
  - Notifications: Web Push (VAPID) with auto-detected IANA timezones

rules:
  proposal:
    - Keep proposals focused on clear business value and architectural boundaries
  tasks:
    - Group tasks by component (Domain, Application, Infrastructure, Api, Frontend)
    - Ensure every task is actionable and testable
    - Ensure 100% English in codebase and documentation
  git_workflow:
    - Always create a dedicated feature branch for each task/feature (`feat/<feature-name>`)
    - Never commit directly to `main` during development
    - Write clean conventional commit messages without any Co-authored-by or AI trailers
    - Merge feature branch into `main` after verification is completed
